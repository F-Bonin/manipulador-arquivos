[project]
name = "file-manager"
version = "0.1.0"
description = "Manipulador de arquivos: separar PDF, converter para Markdown e mesclar em PDF."
requires-python = ">=3.12"

[tool.pytest.ini_options]
# Diz ao pytest onde fica o código (pasta src) para os imports funcionarem
pythonpath = ["src"]
# Pasta onde estão os testes
testpaths = ["tests"]